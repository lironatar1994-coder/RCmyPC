<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f1e1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Claude Remote">
  <title>Claude Remote</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
  <script src="install-prompt.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><span class="spinner"></span></div>

  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <img src="icon.svg" alt="" class="login-mark" width="48" height="48">
      <h1>Claude Remote</h1>
      <p class="muted">Pick a session on your PC and continue it from your phone.</p>
      <label>Username
        <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>Password
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
      <a class="help-link" href="help.html">מדריך שימוש</a>
    </form>
  </main>

  <!-- Panel -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Claude Remote</span></div>
      <button id="pc-chip" class="chip" type="button" aria-live="polite"><span class="dot"></span><span id="pc-text">…</span></button>
    </header>

    <section id="hero" class="hero" hidden aria-live="polite"></section>

    <section id="offline" class="notice" hidden>
      <strong>Your PC isn't answering.</strong>
      <span id="offline-text">The PC has to be on, signed in, and running the agent.</span>
    </section>

    <section id="no-claude" class="notice" hidden>
      <strong>Claude isn't open on the PC.</strong>
      <button class="btn small" type="button" data-action="launch">Start Claude</button>
    </section>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search sessions" autocomplete="off" aria-label="Search sessions">
      </label>
      <button class="icon-btn" type="button" data-action="list" aria-label="Refresh from PC" title="Refresh from PC">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" type="button" data-action="screenshot" aria-label="See the PC screen" title="See the PC screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
    </div>
    <p id="updated" class="updated muted"></p>

    <main id="list" class="list" aria-label="Sessions"></main>
    <p id="empty" class="empty muted" hidden></p>

    <details class="activity">
      <summary>Activity</summary>
      <ol id="jobs"></ol>
    </details>

    <footer class="foot">
      <a class="link" href="help.html">מדריך שימוש</a>
      <button class="link" type="button" id="logout">Sign out</button>
    </footer>
  </div>

  <!-- Screenshot viewer -->
  <div id="shot" class="sheet" hidden role="dialog" aria-modal="true" aria-label="PC screen">
    <div class="sheet-bar">
      <span id="shot-time" class="muted"></span>
      <div>
        <button class="btn small" type="button" data-action="screenshot">Refresh</button>
        <button class="btn small" type="button" id="shot-close">Close</button>
      </div>
    </div>
    <div class="shot-body"><img id="shot-img" alt="Screenshot of the PC"></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
